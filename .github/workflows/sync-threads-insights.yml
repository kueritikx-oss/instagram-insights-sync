# 1日5回（JST 9:30, 12:30, 15:30, 18:30, 21:30）Threads インサイトを取得しスプレッドシートに反映。
# IG版と時刻をずらして API レート制限を分散。
# JST 21:30 (UTC 12:30) にアカウントレベルインサイトも取得。
name: Sync Threads Insights

on:
  schedule:
    # 投稿インサイトのみ: UTC → JST 9:30, 12:30, 15:30, 18:30
    - cron: '30 0,3,6,9 * * *'
    # アカウントインサイトも取得: UTC 12:30 → JST 21:30
    # （github.event.schedule で判定するため、この枠だけ独立した cron に分ける）
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 'アカウントインサイトも取得する'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ====== 投稿インサイト（毎回実行）======
      - name: Sync Threads post insights
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          PYTHONUNBUFFERED: '1'
        run: python sync_threads_insights.py

      # ====== 考察自動生成（views到着済み投稿の結果①〜④・考察・次ポイントを補完）======
      - name: Fill Threads analysis
        if: success()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          PYTHONUNBUFFERED: '1'
        run: python fill_threads_analysis.py

      # ====== アカウントインサイト（UTC 12:30 の cron 枠のみ）======
      # 2026-09-17修正: 以前は `date -u +%H` = "12" の等値判定だったが、GitHub Actions の
      # schedule は毎回1〜4時間遅れて起動するため、このゲートが当たらない。
      # 遅延の影響を受けない github.event.schedule（発火した cron 文字列）で判定する。
      - name: Sync Threads account insights
        if: success() && (github.event.schedule == '30 12 * * *' || github.event.inputs.account == 'true')
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          PYTHONUNBUFFERED: '1'
        run: python sync_threads_insights.py --account

      - name: Alert on failure
        if: failure()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: pip install requests > /dev/null 2>&1 && python scripts/alert_on_failure.py 2>/dev/null || echo "Alert skipped"
